# Optional card for the native trip-charge helpers.
type: vertical-stack
cards:
- type: entities
  title: Trip charge — ready at your chosen SoC
  show_header_toggle: false
  entities:
  - entity: input_datetime.heo_trip_ready_by
    name: Departure date and time
  - entity: input_select.heo_trip_target_soc
    name: Desired car SoC
  - entity: input_boolean.heo_trip_charge_scheduled
    name: Schedule this trip / cancel
  - type: simple-entity
    entity: input_select.heo_trip_charge_status
    name: Schedule status
  - entity: sensor.heo_trip_charge_start
    name: Calculated start
  - entity: sensor.heo_trip_charge_duration
    name: Estimated charge hours
  - entity: sensor.home_energy_ev_soc
    name: Car SoC now
  - entity: sensor.home_energy_ev_actual_current
    name: Actual charging current
- type: markdown
  content: 'Set your departure date/time, then enable the schedule. Start time updates
    until charging begins. This uses HEO''s existing paid Charge to Full override:
    the normal house-battery reserve does not stop it. At your chosen SoC the trip
    override ends; normal HEO policies resume, including keepalive. This is not a
    permanent car charge ceiling.


    The estimate uses HEO''s capacity and maximum configured power; it cannot promise
    the exact finishing minute or predict battery taper. Cancelling returns control
    to normal HEO policy, including its keepalive. Changing the date or target after
    charging starts cancels that trip. If charging is interrupted, re-arm deliberately.'
- type: markdown
  title: Estimated trip impact
  content: "{% set raw = state_attr('sensor.home_energy_trip_charge_status', 'energy_impact')\
    \ -%}\n{% set impact = raw if raw is mapping else {} -%}\n{% set free_start =\
    \ as_datetime(impact.get('until_free_start'), none) -%}\n{% set values = namespace(valid=true)\
    \ -%}\n{% for field in ['pack_energy_kwh', 'wall_energy_kwh', 'before_free_kwh',\n\
    \    'during_free_kwh', 'after_free_kwh', 'battery_available_for_ev_kwh',\n  \
    \  'battery_contribution_kwh', 'extra_paid_energy_kwh', 'cost_min', 'cost_max']\
    \ -%}\n  {% set value = impact.get(field) -%}\n  {% if value is boolean or value\
    \ is not number or not is_number(value) -%}\n    {% set values.valid = false -%}\n\
    \  {% elif value < 0 -%}\n    {% set values.valid = false -%}\n  {% endif -%}\n\
    {% endfor -%}\n{% if impact.get('status') == 'already_at_target' -%}\nThe car\
    \ is already at the selected trip target. No extra trip charging is currently\
    \ needed.\n{% elif impact.get('status') == 'estimated' and values.valid\n    and\
    \ impact.get('scope') == 'before_next_free_window_only'\n    and impact.get('cost_min')\
    \ <= impact.get('cost_max') -%}\n{% set low = '$%.2f' | format(impact.cost_min)\
    \ -%}\n{% set high = '$%.2f' | format(impact.cost_max) -%}\n{% set cost = low\
    \ if impact.cost_min == impact.cost_max else low ~ '–' ~ high -%}\n**Extra cost\
    \ before free power: {{ cost }}**\n{% if impact.get('source') == 'legacy' %}\n\
    Estimate uses your existing trip helpers.\n{% endif %}\n{% if free_start is not\
    \ none %}\nUntil free power starts **{{ as_local(free_start).strftime('%a %d %b,\
    \ %H:%M') }}**.\n{% endif %}\n\n- Energy needed: **{{ '%.1f' | format(impact.wall_energy_kwh)\
    \ }} kWh**, including charging losses.\n- Charging before free power: **{{ '%.1f'\
    \ | format(impact.before_free_kwh) }} kWh**.\n- House battery available for the\
    \ car:\n  **{{ '%.1f' | format(impact.battery_available_for_ev_kwh) }} kWh**,\n\
    \  after expected house use and the configured minimum battery level. Expected\
    \ trip use:\n  **{{ '%.1f' | format(impact.battery_contribution_kwh) }} kWh**.\n\
    - Extra paid energy before free power: **{{ '%.1f' | format(impact.extra_paid_energy_kwh)\
    \ }} kWh**.\n{% if impact.during_free_kwh > 0 or impact.after_free_kwh > 0 %}\n\
    The rest of this trip charge: **{{ '%.1f' | format(impact.during_free_kwh) }}\
    \ kWh during** and\n**{{ '%.1f' | format(impact.after_free_kwh) }} kWh after**\
    \ the next free window.\nLater charging costs are not estimated from the current\
    \ house battery.\n{% endif %}\nThis is extra cost **only until the next free window**,\
    \ not the total trip cost.\nPaid energy includes house power moved onto the grid\
    \ by using its battery for the car.\nNo future solar or export forecast is included.\n\
    Supply charges, lost export earnings and the ZEROHERO credit are excluded.\nHouse\
    \ use, inverter limits, battery protection and slower charging near full can change\
    \ the result.\n{% elif impact.get('status') == 'out_of_scope' -%}\nA before-free\
    \ cost estimate does not apply to this trip's current timing.\nThis does not mean\
    \ the whole trip will be free.\n{% elif impact.get('reason') == 'trip_paused'\
    \ -%}\nThe trip is paused. The estimate will update when charging resumes.\n{%\
    \ elif raw is not mapping -%}\nThe trip energy estimate is not available.\nThis\
    \ card needs an HEO version that provides trip energy-impact data.\n{% else -%}\n\
    The trip energy estimate is not available yet.\nCheck the trip plan and its required\
    \ energy and tariff inputs.\n{% endif %}\n"
