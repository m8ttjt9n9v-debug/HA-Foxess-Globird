title: FoxESS Globird Energy
# Generic, two-column Lovelace starter view.  HACS installs the integration,
# not dashboards.  Version 0.2.31 and later publish stable `sensor.home_energy_*`
# IDs, so this view works regardless of the config-entry display name.
views:
  - type: sections
    max_columns: 2
    title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: entities
            title: Controls & safety
            entities:
              - entity: sensor.home_energy_status
                name: Integration status
              - entity: switch.home_energy_safety_lock
                name: Safety Lock (ON = locked)
              - entity: switch.home_energy_automatic_export
                name: Automatic ZEROHERO export
              - entity: switch.home_energy_automatic_ev_control
                name: Automatic EV control
              - entity: sensor.home_energy_test_status
                name: Diagnostic status
          - type: heading
            heading: Live energy
            heading_style: title
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.home_energy_battery_soc
            name: Battery SOC
            features:
              - type: bar-gauge
            features_position: bottom
          - type: tile
            entity: sensor.home_energy_battery_energy
            name: Battery energy
          - type: tile
            entity: sensor.home_energy_available_energy
            name: Available above reserve
          - type: tile
            entity: sensor.home_energy_solar_power
            name: Solar now
          - type: tile
            entity: sensor.home_energy_house_load
            name: House load
          - type: tile
            entity: sensor.home_energy_grid_import
            name: Grid import
          - type: tile
            entity: sensor.home_energy_grid_export
            name: Grid export
      - type: grid
        cards:
          - type: heading
            heading: Tariff and ZEROHERO
            heading_style: title
            icon: mdi:cash-clock
          - type: tile
            entity: sensor.home_energy_free_window_import
            name: Free-window import
          - type: tile
            entity: sensor.home_energy_free_charge_allowed
            name: Free allowance remaining
          - type: tile
            entity: sensor.home_energy_zerohero_import_window
            name: ZEROHERO import this window
          - type: tile
            entity: sensor.home_energy_bonus_zero_import_allowed
            name: ZEROHERO guard
          - type: tile
            entity: sensor.home_energy_estimated_energy_cost
            name: Estimated cost today
          - type: tile
            entity: sensor.home_energy_daily_import
            name: Grid import today
          - type: tile
            entity: sensor.home_energy_zerohero_export_window
            name: ZEROHERO export this window
          - type: tile
            entity: sensor.home_energy_zerohero_export_status
            name: Export session
      - type: grid
        cards:
          - type: heading
            heading: Planning and learning
            heading_style: title
            icon: mdi:chart-line
          - type: tile
            entity: sensor.home_energy_learned_house_energy
            name: Learned house budget
          - type: tile
            entity: sensor.home_energy_remaining_house_energy
            name: Remaining house budget
          - type: tile
            entity: sensor.home_energy_learning_samples
            name: Learning samples
          - type: tile
            entity: sensor.home_energy_learning_status
            name: Learning status
          - type: tile
            entity: sensor.home_energy_status
            name: Controller status
          - type: tile
            entity: sensor.home_energy_zerohero_sellable_energy
            name: Sellable energy
          - type: tile
            entity: sensor.home_energy_zerohero_planned_export_energy
            name: Planned export
          - type: tile
            entity: sensor.home_energy_zerohero_planned_duration
            name: Planned duration
          - type: tile
            entity: sensor.home_energy_zerohero_planned_start
            name: Planned export start
      - type: grid
        column_span: 2
        cards:
          - type: history-graph
            title: Power and battery history
            hours_to_show: 24
            entities:
              - entity: sensor.home_energy_grid_import
                name: Grid import
              - entity: sensor.home_energy_grid_export
                name: Grid export
              - entity: sensor.home_energy_house_load
                name: House load
              - entity: sensor.home_energy_solar_power
                name: Solar
  - type: sections
    max_columns: 2
    title: EV
    path: ev
    icon: mdi:car-electric
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: EV charging
            heading_style: title
            icon: mdi:ev-station
          - type: tile
            entity: sensor.home_energy_ev_soc
            name: EV SOC
            features:
              - type: bar-gauge
            features_position: bottom
          - type: tile
            entity: sensor.home_energy_ev_max_power
            name: EV maximum power
          - type: tile
            entity: sensor.home_energy_ev_control_status
            name: EV controller
          - type: tile
            entity: sensor.home_energy_ev_current_target
            name: Current target
          - type: tile
            entity: sensor.home_energy_ev_requested_current
            name: Tessie current setting
          - type: tile
            entity: sensor.home_energy_ev_actual_current
            name: Current actually flowing
          - type: tile
            entity: sensor.home_energy_ev_charge_limit_target
            name: Charge-limit target
          - type: tile
            entity: sensor.home_energy_ev_applied_charge_limit
            name: Car-reported charge limit
          - type: tile
            entity: sensor.home_energy_ev_reconciliation_attempts
            name: Reconciliation attempts
          - type: markdown
            content: >-
              The direct-EVSE free-window path is a faithful, independently
              gated Mangerton port. It remains off until explicitly mapped,
              commissioned, unlocked, and enabled. Add the vehicle's own
              Tessie cards here if desired; entity names vary by vehicle and
              are deliberately not hard-coded in this template.
      - type: grid
        cards:
          - type: heading
            heading: EV commissioning
            heading_style: title
            icon: mdi:clipboard-check-outline
          - type: entities
            entities:
              - entity: sensor.home_energy_status
                name: Orchestrator status
              - entity: sensor.home_energy_free_charge_allowed
                name: Free allowance remaining
              - entity: sensor.home_energy_ev_grid_current_average
                name: Matched grid-current average
              - entity: sensor.home_energy_ev_actual_current_average
                name: Matched actual-EV-current average
              - entity: switch.home_energy_safety_lock
                name: Safety Lock (ON = no writes)
              - entity: switch.home_energy_automatic_ev_control
                name: Automatic EV control
          - type: markdown
            content: >-
              Confirm EV telemetry, current/limit writable ranges, location,
              cable state, and the service-current mapping before commissioning.
              Multiphase sites require signed current for the most-loaded phase;
              aggregate three-phase power is deliberately insufficient. Leave
              Automatic EV Control off and Safety Lock on during verification.
  - type: sections
    max_columns: 2
    title: Commissioning
    path: commissioning
    icon: mdi:shield-check
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Safety and data quality
            heading_style: title
            icon: mdi:shield-check
          - type: entities
            entities:
              - entity: sensor.home_energy_status
                name: Controller status
              - entity: sensor.home_energy_tariff_status
                name: Tariff guard
              - entity: sensor.home_energy_bonus_zero_import_allowed
                name: ZEROHERO guard
              - entity: sensor.home_energy_learning_status
                name: Learning model
              - entity: sensor.home_energy_learning_samples
                name: Learning samples
          - type: markdown
            content: >-
              This view is intentionally read-only.  Check the signed grid
              import/export values against a known load before enabling any
              FoxESS writes. HEO remains observer-only until Local Modbus
              ownership and the relevant FoxESS gates are commissioned.
  - type: sections
    max_columns: 2
    title: Diagnostics
    path: diagnostics
    icon: mdi:test-tube
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Manual FoxESS diagnostics
            heading_style: title
            icon: mdi:flask-outline
          - type: markdown
            content: >-
              Set the power and duration first.  The cost/earning preview is
              calculated before submission.  The charge action is hard-blocked
              outside the configured free window.  Both actions require
              complete FoxESS mappings and the Safety Lock (Rehearsal mode)
              disabled.  A test is
              limited to 120 minutes and automatically restores Self Use when
              it ends. This diagnostic surface does not enable the automatic
              scheduler. The export preview uses the configured standard or
              ZEROHERO-window export rate and updates with the current time.
          - type: entities
            title: Diagnostics parameters
            entities:
              - entity: number.home_energy_test_charge_power
                name: Charge power
              - entity: number.home_energy_test_discharge_power
                name: Discharge power
              - entity: number.home_energy_test_duration
                name: Duration
          - type: entities
            title: Preview
            entities:
              - entity: sensor.home_energy_test_charge_estimated_cost
                name: Estimated charge cost
              - entity: sensor.home_energy_test_charge_import_rate
                name: Current import rate
              - entity: sensor.home_energy_test_discharge_estimated_earning
                name: Estimated discharge earning
              - entity: sensor.home_energy_test_discharge_export_rate
                name: Current export rate
              - entity: sensor.home_energy_test_status
                name: Diagnostic status
              - entity: sensor.home_energy_test_remaining_minutes
                name: Remaining time
          - type: grid
            columns: 2
            cards:
              - type: button
                entity: button.home_energy_test_force_charge
                name: Submit charge test
                icon: mdi:battery-arrow-up-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_force_charge
                  confirmation:
                    text: Submit the force-charge test now?
              - type: button
                entity: button.home_energy_test_force_discharge
                name: Submit discharge test
                icon: mdi:battery-arrow-down-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_force_discharge
                  confirmation:
                    text: Submit the force-discharge test now?
              - type: button
                entity: button.home_energy_test_stop
                name: Stop and restore Self Use
                icon: mdi:stop-circle-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_stop
                  confirmation:
                    text: Stop the active test and restore Self Use?
      - type: grid
        cards:
          - type: heading
            heading: Live feedback
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: entities
            entities:
              - entity: sensor.home_energy_status
                name: Controller status
              - entity: sensor.home_energy_battery_soc
                name: Battery SOC
              - entity: sensor.home_energy_battery_energy
                name: Battery energy
              - entity: sensor.home_energy_grid_import
                name: Grid import
              - entity: sensor.home_energy_grid_export
                name: Grid export
              - entity: sensor.home_energy_house_load
                name: House load
              - entity: sensor.home_energy_solar_power
                name: Solar generation
          - type: history-graph
            title: Test feedback history
            hours_to_show: 2
            entities:
              - entity: sensor.home_energy_grid_import
                name: Grid import
              - entity: sensor.home_energy_grid_export
                name: Grid export
              - entity: sensor.home_energy_battery_energy
                name: Battery energy
