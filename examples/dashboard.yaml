title: FoxESS Globird Energy
# Portable counterpart of the proven site's operational dashboard. HACS installs
# the integration, not dashboards. All entity IDs below are integration-owned;
# vehicle, weather, room, and site-specific cards belong in a local overlay.
views:
  - type: sections
    max_columns: 2
    title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live Site Power
            heading_style: title
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.home_energy_battery_soc
            name: Home battery SOC
            features:
              - type: bar-gauge
            features_position: bottom
          - type: tile
            entity: sensor.home_energy_ev_soc
            name: EV SOC
            features:
              - type: bar-gauge
            features_position: bottom
          - type: tile
            entity: sensor.home_energy_solar_power
            name: Solar generation
          - type: tile
            entity: sensor.home_energy_house_load
            name: House load
          - type: tile
            entity: sensor.home_energy_grid_import
            name: Grid import
          - type: tile
            entity: sensor.home_energy_grid_export
            name: Grid export
      - type: grid
        cards:
          - type: heading
            heading: Energy at a Glance
            heading_style: title
            icon: mdi:gauge
          - type: tile
            entity: sensor.home_energy_estimated_net_cost
            name: Forecast net cost today
          - type: tile
            entity: sensor.home_energy_measured_net_cost
            name: Measured net cost so far
          - type: tile
            entity: sensor.home_energy_available_energy
            name: Available above reserve
          - type: tile
            entity: sensor.home_energy_free_energy_remaining
            name: Free energy remaining
          - type: tile
            entity: sensor.home_energy_daily_import
            name: Grid import today
          - type: tile
            entity: sensor.home_energy_daily_export
            name: Grid export today
          - type: tile
            entity: sensor.home_energy_estimated_energy_cost
            name: Measured import and supply cost
          - type: tile
            entity: sensor.home_energy_estimated_export_revenue
            name: Export revenue today
          - type: tile
            entity: sensor.home_energy_zerohero_credit
            name: Evidenced ZEROHERO credit today
          - type: entities
            title: Forecast assumptions — not a retailer bill
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.home_energy_estimated_net_cost
                attribute: assumed_zerohero_credit
                name: Assumed ZEROHERO credit
              - type: attribute
                entity: sensor.home_energy_estimated_net_cost
                attribute: forecast_remaining_export_kwh
                name: Remaining forecast export (kWh)
          - type: markdown
            content: >-
              The full-day net forecast is optimistic and includes assumed
              export and ZEROHERO credit. Measured net cost uses the observed
              ledger and evidenced credit only. Neither is the retailer's
              settled bill; negative cost means estimated net revenue.
      - type: grid
        cards:
          - type: heading
            heading: Current Plan
            heading_style: title
            icon: mdi:calendar-clock
          - type: entities
            title: Operating mode — read-only
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.home_energy_status
                attribute: mode
                name: HEO mode
              - type: attribute
                entity: sensor.home_energy_status
                attribute: foxess_control_owner
                name: Commissioned inverter owner
              - type: attribute
                entity: sensor.home_energy_status
                attribute: control_gate
                name: Inverter write gate
          - type: tile
            entity: sensor.home_energy_status
            name: Orchestrator status
          - type: tile
            entity: sensor.home_energy_free_charge_completion
            name: Battery charge controller
          - type: tile
            entity: sensor.home_energy_free_charge_power_target
            name: Battery charge power
          - type: tile
            entity: sensor.home_energy_zerohero_export_status
            name: Export controller
          - type: tile
            entity: sensor.home_energy_zerohero_sellable_energy
            name: Sellable energy
          - type: tile
            entity: sensor.home_energy_zerohero_planned_start
            name: Planned export start
          - type: tile
            entity: sensor.home_energy_zerohero_planned_export_energy
            name: Planned export
          - type: tile
            entity: sensor.home_energy_zerohero_planned_duration
            name: Planned duration
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Latest Matched Daily Scorecard
            heading_style: title
            icon: mdi:calendar-check
          - type: entities
            title: Compare the same completed retailer day
            show_header_toggle: false
            entities:
              - entity: sensor.home_energy_forecast_scorecard_status
                name: Match status
              - type: attribute
                entity: sensor.home_energy_forecast_scorecard_status
                attribute: result_date
                name: Matched result date
              - entity: sensor.home_energy_forecast_yesterday_cost
                name: Matched-day frozen forecast
              - entity: sensor.home_energy_globird_yesterday_actual_cost
                name: Matched-day retailer cost
              - entity: sensor.home_energy_forecast_error_yesterday
                name: Matched-day forecast error
              - type: attribute
                entity: sensor.home_energy_forecast_scorecard_status
                attribute: zerohero_status
                name: Matched-day retailer ZEROHERO outcome
          - type: markdown
            content: >-
              The latest complete matched result may be older than yesterday.
              Use its displayed date, not today's forecast or an undated native
              retailer sensor. Missing or mismatched dates do not form a scorecard.

