              - entity: switch.home_energy_ev_before_export
                name: Prioritise EV before export
              - entity: number.home_energy_ev_before_export_soc_target
                name: Keep energy for EV until SoC reaches
              - entity: sensor.home_energy_ev_before_export_status
                name: Current priority decision
          - type: tile
            entity: sensor.home_energy_ev_current_target
            name: Current target
          - type: tile
            entity: sensor.home_energy_ev_requested_current
            name: Tessie current setting
          - type: tile
            entity: sensor.home_energy_ev_actual_current
            name: Current actually flowing
          - type: tile
            entity: sensor.home_energy_ev_charge_limit_target
            name: Charge-limit target
          - type: tile
            entity: sensor.home_energy_ev_applied_charge_limit
            name: Car-reported charge limit
          - type: tile
            entity: sensor.home_energy_ev_reconciliation_attempts
            name: Reconciliation attempts
          - type: tile
            entity: sensor.home_energy_ev_smart_socket_recovery_status
            name: Smart-socket recovery
          - type: markdown
            content: >-
              HEO exposes the portable charging decision chain. Add the
              vehicle's own Tessie status, access, climate, and health cards in
              a site overlay; Tessie entity names are deliberately not embedded
              in the shared dashboard. Charge to full raises the target but
              does not bypass the displayed safety and electrical limits.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Solar Spill and Pre-Free Backfill
            heading_style: title
            icon: mdi:solar-power-variant
          - type: markdown
            content: >-
              Ready by is the default Backfill timing in EV Charging policies;
              it uses available battery surplus before departure and appears in
              the ready-by cards below. An explicitly saved Conservative choice
              still finishes before free power. Changing the timing default
              does not turn on backfill or automatic EV control.
          - type: tile
            entity: switch.home_energy_ev_morning_solar
            name: Morning solar EV charging
          - type: tile
            entity: number.home_energy_ev_morning_solar_reserve_soc
            name: Morning house-battery reserve
          - type: tile
            entity: sensor.home_energy_ev_solar_spill_status
            name: Solar-spill decision
          - type: tile
            entity: sensor.home_energy_ev_solar_spill_current_target
            name: Solar-spill current
          - type: tile
            entity: sensor.home_energy_ev_solar_spill_surplus
            name: Reconstructed surplus
          - type: tile
            entity: sensor.home_energy_ev_pre_free_status
            name: Pre-free phase
          - type: tile
            entity: sensor.home_energy_ev_pre_free_planned_energy
            name: Pre-free energy budget
          - type: tile
            entity: sensor.home_energy_ev_pre_free_planned_start
            name: Latest start
          - type: tile
            entity: sensor.home_energy_ev_pre_free_current_target
            name: Pre-free current
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: EV Ready-By Backfill
            heading_style: title
            icon: mdi:car-clock
          - type: markdown
            content: >-
              A fixed daily wall-energy allocation protects energy from HEO
              export; FoxCloud cannot guarantee that prior export preserved
              it. Default Ready by timing uses currently safe battery surplus
              after protecting the home, requires Local Modbus, and works with
              the fixed allocation at zero. It adds no new evening reservation.
              Both use the shared ready time and ledger. Ready by may start
              overnight after midnight, retains the battery reserve and power
              limits, and ends at the ready deadline before free power. The
              original latest-start pre-free stage becomes eligible again from
              the current protected budget. Morning solar may run while it
              waits; active pre-free owns current until free-window takeover. The allocation
              remaining and shortfall cards describe the fixed quota, while
              planned wall energy includes eligible surplus. Charge to full
              is a separate paid-grid override, bounded by connector/service
              limits; its energy and free-window charging are excluded from
              ready-cycle delivery.
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_status
            name: Ready-by decision
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_remaining
            name: Protected allocation remaining
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_delivered
            name: Delivered this ready cycle
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_planned_energy
            name: Planned wall energy
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_shortfall
            name: Allocation shortfall
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_planned_start
            name: Latest start
          - type: tile
            entity: sensor.home_energy_ev_daily_backfill_current_target
            name: Capped current
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Daily Driving and Charge-Limit Learning
            heading_style: title
            icon: mdi:chart-bell-curve-cumulative
          - type: tile
            entity: sensor.home_energy_ev_driving_learning_status
            name: Learning mode
          - type: tile
            entity: sensor.home_energy_ev_driving_learning_samples
            name: Valid daily samples
          - type: tile
            entity: sensor.home_energy_ev_daily_driving_energy
            name: Latest daily driving
          - type: tile
            entity: sensor.home_energy_ev_driving_p85
            name: P85 daily driving
          - type: tile
            entity: sensor.home_energy_ev_usable_capacity
            name: Estimated usable capacity
          - type: tile
            entity: sensor.home_energy_ev_free_window_soc_gain
            name: Full-window SOC gain
          - type: tile
            entity: sensor.home_energy_ev_learned_charge_limit
            name: Learned general limit
      - type: grid
        column_span: 2
        cards:
          - type: history-graph
            title: Tesla Battery and Charging — 24 Hours
            hours_to_show: 24
            entities:
              - entity: sensor.home_energy_ev_soc
                name: EV SOC
              - entity: sensor.home_energy_ev_actual_current
                name: Actual current
              - entity: sensor.home_energy_ev_current_target
                name: Current target

  - type: sections
    max_columns: 2
    title: Trip Charge
    path: trip-charge
    icon: mdi:car-clock
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: One-Off Trip Charge
            heading_style: title
            icon: mdi:car-clock
          - type: entities
            title: Native HEO trip schedule — explicit paid override
            show_header_toggle: false
            entities:
              - entity: datetime.home_energy_trip_ready_by
                name: Departure date and time
              - entity: select.home_energy_trip_target_soc
                name: Selected trip target (1–100%)
              - entity: number.home_energy_trip_extra_minutes
                name: Extra planning minutes
              - entity: switch.home_energy_trip_charge_scheduled
                name: Schedule this one-off trip
              - entity: sensor.home_energy_trip_charge_status
                name: Trip status
              - entity: sensor.home_energy_trip_charge_planned_start
                name: Estimated charging start
              - entity: sensor.home_energy_trip_charge_duration
                name: Estimated charging duration (hours)
          - type: markdown
            content: >-
              Scheduling is off by default. This uses HEO's existing paid Charge
              to Full override: it may import paid grid energy and bypass normal
              battery-reserve/90% policies, but not commissioning, Safety Lock,
              connector or service limits. Start time and reported SoC are
              estimates, not exact-time or physical-percentage guarantees.
              Cancel to withdraw the trip-owned request and return to existing
              normal policies; do not cancel another user's Full request.
              These are native HEO entities, not the separate legacy input-helper
              wrapper. Never run two trip schedulers for the same EV.

