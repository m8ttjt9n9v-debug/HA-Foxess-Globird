  - type: sections
    max_columns: 2
    title: Manual
    path: manual
    icon: mdi:book-open-variant
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Dashboard Guide
            heading_style: title
            icon: mdi:information-outline
          - type: markdown
            content: >-
              Overview answers where power is going and what HEO plans next.
              Tesla shows portable vehicle decisions. House explains battery,
              protected demand, and export planning. Solar & Weather separates
              portable solar evidence from optional site weather cards.
              Configuration contains routine gates and commissioning guidance.
              Advanced exposes the decision chain and feedback health. Manual
              separates persistent manual battery holds from bounded diagnostic tests.
          - type: markdown
            content: >-
              **Units and signs:** power is shown in kW, energy in kWh, current
              in A, and SOC in %. Confirm the mapped signed grid and battery
              conventions against direct evidence before enabling writes.
              Safety Lock ON blocks every HEO hardware write; turning it OFF
              does not independently enable automation.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Manual Battery Control — Persistent Hold
            heading_style: title
            icon: mdi:hand-back-right-outline
          - type: markdown
            content: >-
              Export requests the lesser commissioned/native inverter maximum
              until Stop; it does not enforce the automatic house/EV reserve or
              daily sellable-energy budget. The inverter/BMS retains physical
              protections. Disable competing VPP/cloud and other inverter writers
              before confirming Export or Resume. This assertion does not disable
              them for you. Stop clears both forced targets and holds Self Use;
              automatic battery control remains paused until explicit Resume.
              EV policies are unchanged. Safety Lock and ownership still apply.
              These buttons resolve only a single HEO entry. With multiple entries,
              add the reviewed entry_id to each action; never guess an entry or
              place credentials in the browser. Importing this dashboard sends no command.
          - type: entities
            title: Intent, native feedback and cleanup — not physical delivery
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.home_energy_status
                attribute: manual_inverter_hold
                name: Automatic battery control held
              - type: attribute
                entity: sensor.home_energy_status
                attribute: manual_inverter_target
                name: Manual requested target
              - type: attribute
                entity: sensor.home_energy_status
                attribute: manual_inverter_status
                name: Manual command status
              - type: attribute
                entity: sensor.home_energy_status
                attribute: manual_inverter_power_kw
                name: Manual requested inverter output (kW)
              - type: attribute
                entity: sensor.home_energy_status
                attribute: manual_inverter_command_confirmed
                name: Native command feedback confirmed
              - type: attribute
                entity: sensor.home_energy_status
                attribute: export_authority_source
                name: Automatic export source
              - type: attribute
                entity: sensor.home_energy_status
                attribute: export_price_deadline
                name: Retained price deadline
              - type: attribute
                entity: sensor.home_energy_status
                attribute: export_session_phase
                name: Export session / cleanup phase
              - type: attribute
                entity: sensor.home_energy_status
                attribute: last_control_reason
                name: Last automatic-control reason
          - type: markdown
            content: >-
              Stopping, recovering or blocked is not proof of cleared targets.
              Native command feedback is not proof of physical grid export or
              retailer payment. Check measured battery/grid flow and native
              feedback; Safety Lock also blocks cleanup writes.
          - type: grid
            columns: 3
            cards:
              - type: button
                entity: sensor.home_energy_status
                name: Export at maximum inverter output
                icon: mdi:transmission-tower-export
                tap_action:
                  action: call-service
                  service: home_energy_orchestrator.manual_export_max
                  service_data:
                    local_control_confirmed: true
                  confirmation:
                    text: Export until Stop, bypassing automatic energy budgets? Confirm competing inverter writers are disabled.
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: button
                entity: sensor.home_energy_status
                name: Stop / Self Use — keep manual hold
                icon: mdi:stop-circle-outline
                tap_action:
                  action: call-service
                  service: home_energy_orchestrator.manual_self_use
                  confirmation:
                    text: Clear both forced inverter targets and hold Self Use? Automatic battery control stays paused; EV control is unchanged.
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: button
                entity: sensor.home_energy_status
                name: Resume existing automatic battery requests
                icon: mdi:play-circle-outline
                tap_action:
                  action: call-service
                  service: home_energy_orchestrator.manual_resume_automatic
                  service_data:
                    local_control_confirmed: true
                  confirmation:
                    text: Release the hold using unchanged automatic requests? Confirm competing inverter writers are disabled; no switch will be enabled.
                hold_action:
                  action: none
                double_tap_action:
                  action: none
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Manual FoxESS Diagnostics
            heading_style: title
            icon: mdi:flask-outline
          - type: markdown
            content: >-
              Set power and duration before submitting a test. Charge tests are
              blocked outside the configured free window. Both tests require
              Local Modbus ownership, complete actuator mappings, the FoxESS
              automatic gate, and Safety Lock OFF. Tests are bounded to 120
              minutes and restore Self Use when stopped or completed.
          - type: entities
            title: Diagnostic Parameters
            show_header_toggle: false
            entities:
              - entity: number.home_energy_test_charge_power
                name: Charge power
              - entity: number.home_energy_test_discharge_power
                name: Discharge power
              - entity: number.home_energy_test_duration
                name: Duration
          - type: entities
            title: Preview and Feedback
            show_header_toggle: false
            entities:
              - entity: sensor.home_energy_test_charge_estimated_cost
                name: Estimated charge cost
              - entity: sensor.home_energy_test_charge_import_rate
                name: Current import rate
              - entity: sensor.home_energy_test_discharge_estimated_earning
                name: Estimated discharge earning
              - entity: sensor.home_energy_test_discharge_export_rate
                name: Current export rate
              - entity: sensor.home_energy_test_status
                name: Diagnostic status
              - entity: sensor.home_energy_test_remaining_minutes
                name: Remaining time
          - type: grid
            columns: 2
            cards:
              - type: button
                entity: button.home_energy_test_force_charge
                name: Submit charge test
                icon: mdi:battery-arrow-up-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_force_charge
                  confirmation:
                    text: Submit the force-charge test now?
              - type: button
                entity: button.home_energy_test_force_discharge
                name: Submit discharge test
                icon: mdi:battery-arrow-down-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_force_discharge
                  confirmation:
                    text: Submit the force-discharge test now?
              - type: button
                entity: button.home_energy_test_stop
                name: Stop diagnostic test / restore Self Use
                icon: mdi:stop-circle-outline
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.home_energy_test_stop
                  confirmation:
                    text: Stop the active diagnostic test and request Self Use? This is not the manual-hold Stop control.
      - type: grid
        column_span: 2
        cards:
          - type: history-graph
            title: Test Feedback History
            hours_to_show: 2
            entities:
              - entity: sensor.home_energy_grid_import
                name: Grid import
              - entity: sensor.home_energy_grid_export
                name: Grid export
              - entity: sensor.home_energy_battery_energy
                name: Battery energy
