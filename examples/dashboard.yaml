  - type: sections
    max_columns: 2
    title: Configuration
    path: configuration
    icon: mdi:tune-variant
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Operating Modes
            heading_style: title
            icon: mdi:toggle-switch-outline
          - type: entities
            title: Safety and Current State
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.home_energy_status
                attribute: mode
                name: Current operating mode
              - type: attribute
                entity: sensor.home_energy_status
                attribute: control_gate
                name: FoxESS control gate
              - type: attribute
                entity: sensor.home_energy_status
                attribute: ev_control_gate
                name: EV control gate
              - entity: switch.home_energy_safety_lock
                name: Block all hardware commands
              - entity: binary_sensor.home_energy_sign_conventions_verified
                name: Electrical directions verified
          - type: entities
            title: Automation Requests
            show_header_toggle: false
            entities:
              - entity: switch.home_energy_automatic_charge
                name: Automatic battery free charge
              - entity: switch.home_energy_automatic_export
                name: Automatic ZEROHERO export
              - entity: switch.home_energy_ev_before_export
                name: Prioritise EV before export
              - entity: number.home_energy_ev_before_export_soc_target
                name: EV priority SoC target
              - entity: sensor.home_energy_ev_before_export_status
                name: EV/export priority state
              - entity: switch.home_energy_automatic_ev_control
                name: Automatic EV control
              - entity: switch.home_energy_ev_charge_to_full
                name: Temporarily charge EV to full
              - entity: select.home_energy_house_occupancy_mode
                name: House-energy occupancy policy
              - entity: sensor.home_energy_test_status
                name: Diagnostic status
          - type: markdown
            content: >-
              **Safety Lock:** ON means HEO is locked and cannot send any
              hardware command. OFF only removes that final interlock; it does
              not enable an automation. Each automation request remains
              independent and also requires its displayed control gate to be
              ready. There is no hidden card-level master switch.
          - type: markdown
            content: >-
              Use Settings → Devices & services → FoxESS Globird Energy
              Observer → Configure to map hardware and edit site limits,
              tariff windows, ownership, charging policy, reserve, and export
              settings. The shared dashboard never embeds one site's values.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Market Price and Automatic Export
            heading_style: title
            icon: mdi:chart-line
          - type: entities
            title: Current price and eligibility
            show_header_toggle: false
            entities:
              - entity: sensor.home_energy_aemo_spot_price
                name: Current wholesale price
              - entity: sensor.home_energy_aemo_market_status
                name: Price observation status
              - type: attribute
                entity: sensor.home_energy_aemo_market_status
                attribute: source_kind
                name: Accepted price source
              - type: attribute
                entity: sensor.home_energy_aemo_market_status
                attribute: source_fresh
                name: Price source is fresh
              - type: attribute
                entity: sensor.home_energy_aemo_market_status
                attribute: price_trigger_valid
                name: Price evidence is eligible
              - type: attribute
                entity: sensor.home_energy_aemo_market_status
                attribute: interval_end
                name: Price interval expires
              - entity: switch.home_energy_aemo_monitor
                name: Observe current AEMO prices
              - entity: select.home_energy_aemo_region
                name: Explicit market region
              - entity: number.home_energy_aemo_export_threshold
                name: Export threshold (AUD/kWh)
              - entity: switch.home_energy_critical_event_sell
                name: Automatic price-triggered export
              - type: attribute
                entity: sensor.home_energy_status
                attribute: export_authority_source
                name: Current export authority
              - type: attribute
                entity: sensor.home_energy_status
                attribute: export_price_deadline
                name: Retained price deadline
          - type: markdown
            content: >-
              Monitoring and price-triggered export start OFF. A qualifying
              current interval may admit export through the existing protected
              export policy and commissioned write gates. Missing or expired
              price data cannot authorize new export. Price observations do not
              establish a retailer event or payment. Automatic price-triggered
              buying is unsupported; the observation-only import threshold is
              not a buying control. A software deadline needs Home Assistant
              and actuator services to remain available. Adding this panel does
              not enable either request or change an existing setting.
      - type: grid
        cards:
