# Optional native HA package; HACS does not install this automatically.
# Set explicit car location/cable mappings and commissioned helper values first.
# Generated by python -m scripts.trip_charge_wrapper --write
input_datetime:
  heo_trip_ready_by:
    name: HEO Trip Ready By
    has_date: true
    has_time: true
  heo_trip_started_for:
    name: HEO Trip Started For
    has_date: true
    has_time: true
input_boolean:
  heo_trip_charge_scheduled:
    name: HEO Trip Charge Scheduled
    icon: mdi:calendar-clock
  heo_trip_charge_started:
    name: HEO Trip Charge Started
    icon: mdi:car-clock
input_select:
  heo_trip_target_soc:
    name: HEO Trip Target SoC
