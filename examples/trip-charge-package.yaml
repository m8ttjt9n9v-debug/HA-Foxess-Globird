input_text:
  heo_trip_full_generation:
    name: HEO Trip Full Generation
    max: 120
  heo_trip_resume_state:
    name: HEO Trip Resume State
    max: 255
input_number:
  heo_trip_started_target:
    name: HEO Trip Started Target
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: '%'
  heo_trip_charge_efficiency:
    name: HEO Trip Charge Efficiency
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: '%'
  heo_trip_extra_minutes:
    name: HEO Trip Extra Minutes
    min: 0
    max: 120
    step: 1
    mode: box
    unit_of_measurement: min
  heo_trip_override_timeout:
    name: HEO Trip Override Timeout
    min: 0
    max: 48
    step: 0.5
    mode: box
    unit_of_measurement: h
template:
- sensor:
  - name: HEO Trip Charge Plan
    unique_id: heo_trip_charge_plan
    state: "{% set soc = states('sensor.home_energy_ev_soc') | float(none) %}\n{%\
      \ set cap = states('sensor.home_energy_ev_usable_capacity') | float(none) %}\n\
      {% set kw = states('sensor.home_energy_ev_max_power') | float(none) %}\n{% set\
      \ eff = states('input_number.heo_trip_charge_efficiency') | float(none) %}\n\
      {% set extra = states('input_number.heo_trip_extra_minutes') | float(0) %}\n\
      {% set maximum = states('input_number.heo_trip_override_timeout') | float(0)\
      \ %}\n{% set target_label = states('input_select.heo_trip_target_soc') %}\n\
      {% set target = target_label | replace('%', '') | float(none) %}\n{% set due\
      \ = state_attr('input_datetime.heo_trip_ready_by', 'timestamp') %}\n{% if soc\
      \ is not none and 0 <= soc <= 100 and cap is not none and 0 < cap <= 1000\n\
      \      and kw is not none and 0 < kw <= 100 and eff is not none and 0 < eff\
      \ <= 100\n      and due is number and due > 0 and 0 <= extra <= 120 and 0 <\
      \ maximum <= 48\n      and target is not none and 1 <= target <= 100\n     \
      \ and target_label == (target | int | string) ~ '%'\n      and state_attr('sensor.home_energy_ev_usable_capacity',\
      \ 'unit_of_measurement') == 'kWh'\n      and state_attr('sensor.home_energy_ev_max_power',\
      \ 'unit_of_measurement') == 'kW' %}\n  {% set hours = ([target - soc, 0] | max\
      \ * cap / 100) / (kw * eff / 100) + extra / 60 %}\n  {% if hours <= maximum\
      \ %}\n    {{ {'v': 2, 'due': due, 'target': target, 'soc': soc, 'cap': cap,\
      \ 'kw': kw, 'eff': eff,\n        'extra': extra, 'maximum': maximum, 'hours':\
      \ hours | round(6),\n        'start': due - hours * 3600} | to_json }}\n  {%\
      \ else %}\n    {{ {'v': 0, 'reason': 'Charge duration exceeds override timeout'}\
      \ | to_json }}\n  {% endif %}\n{% else %}{{ {'v': 0, 'reason': 'Missing or invalid\
      \ commissioned inputs'} | to_json }}{% endif %}\n"
  - name: HEO Trip Charge Duration
    unique_id: heo_trip_charge_duration
    unit_of_measurement: h
    device_class: duration
    availability: '{{ (states(''sensor.heo_trip_charge_plan'') | from_json({})).get(''v'')
      == 2 }}'
    state: '{{ (states(''sensor.heo_trip_charge_plan'') | from_json({})).get(''hours'')
      }}'
  - name: HEO Trip Charge Start
    unique_id: heo_trip_charge_start
    device_class: timestamp
    availability: '{{ (states(''sensor.heo_trip_charge_plan'') | from_json({})).get(''v'')
      == 2 }}'
    state: '{% set plan = states(''sensor.heo_trip_charge_plan'') | from_json({})
      %}{{ as_datetime(plan.get(''start'')).isoformat() if plan.get(''v'') == 2 else
      none }}'
automation:
- id: heo_trip_charge_dispatch
  alias: HEO Trip charge — schedule existing full override
  description: One-off trip target. HEO owns EV commands; this schedules and ends
    intent.
  mode: queued
  max: 10
  max_exceeded: silent
  triggers:
  - trigger: time
    at: sensor.heo_trip_charge_start
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id:
    - input_datetime.heo_trip_ready_by
    - input_boolean.heo_trip_charge_scheduled
    - input_select.heo_trip_target_soc
    - sensor.home_energy_ev_soc
    from: null
  - trigger: state
    entity_id: switch.home_energy_ev_charge_to_full
    from: null
    id: full_changed
  - trigger: state
    entity_id:
    - device_tracker.your_ev
    - binary_sensor.your_ev_cable
    from: null
  - trigger: state
    entity_id: sensor.home_energy_trip_charge_status
  - trigger: state
    entity_id: sensor.home_energy_ev_control_status
    attribute: startup_feedback_pending
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.heo_trip_charge_scheduled'', ''on'')
      or is_state(''input_boolean.heo_trip_charge_started'', ''on'') or states(''input_text.heo_trip_resume_state'')
      not in ['''', ''unknown'', ''unavailable''] }}'
  actions:
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.heo_trip_charge_started'', ''on'')
        and ((trigger is defined and trigger.get(''id'') == ''startup'') or states(''switch.home_energy_ev_charge_to_full'')
        not in [''on'', ''off''] or (not has_value(''sensor.home_energy_ev_control_status'')
        or state_attr(''sensor.home_energy_ev_control_status'', ''startup_feedback_pending'')
        is not sameas false)) }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.heo_trip_full_generation
      data:
        value: restoring
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.heo_trip_charge_started'', ''on'')
        and is_state(''input_text.heo_trip_full_generation'', ''restoring'') and is_state(''switch.home_energy_ev_charge_to_full'',
        ''on'') and states[''switch.home_energy_ev_charge_to_full''].context.user_id
        is none }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.heo_trip_full_generation
      data:
        value: '{{ ''on:'' ~ states[''switch.home_energy_ev_charge_to_full''].last_changed.isoformat()
          ~ '':'' ~ states[''switch.home_energy_ev_charge_to_full''].context.id }}'
  - variables:
      plan: '{{ states(''sensor.heo_trip_charge_plan'') | from_json({}) }}'
      due: '{{ state_attr(''input_datetime.heo_trip_ready_by'', ''timestamp'') | float(0)
        }}'
      ticket: '{{ state_attr(''input_datetime.heo_trip_started_for'', ''timestamp'')
        | float(0) }}'
      now_ts: '{{ now().timestamp() }}'
      soc: '{{ states(''sensor.home_energy_ev_soc'') | float(-1) }}'
      target: '{{ states(''input_select.heo_trip_target_soc'') | replace(''%'', '''')
        | float(-1) }}'
      started_target: '{{ states(''input_number.heo_trip_started_target'') | float(-1)
        }}'
      armed: '{{ is_state(''input_boolean.heo_trip_charge_scheduled'', ''on'') }}'
      owned: '{{ is_state(''input_boolean.heo_trip_charge_started'', ''on'') }}'
      override_on: '{{ is_state(''switch.home_energy_ev_charge_to_full'', ''on'')
        }}'
      override_state: '{{ states(''switch.home_energy_ev_charge_to_full'') }}'
      owns_current_full: '{{ is_state(''input_boolean.heo_trip_charge_started'', ''on'')
        and is_state(''switch.home_energy_ev_charge_to_full'', ''on'') and (states(''input_text.heo_trip_resume_state'')
        in ['''', ''unknown'', ''unavailable''] or ((states(''input_text.heo_trip_resume_state'')
        | from_json({})) is mapping and (states(''input_text.heo_trip_resume_state'')
        | from_json({})).get(''generation'') is integer and (states(''input_text.heo_trip_resume_state'')
        | from_json({})).get(''generation'') == state_attr(''sensor.home_energy_trip_charge_status'',
        ''full_generation''))) and states[''switch.home_energy_ev_charge_to_full''].context.user_id
        is none and (states(''input_text.heo_trip_full_generation'').startswith(''on:''
        ~ states[''switch.home_energy_ev_charge_to_full''].last_changed.isoformat()
        ~ '':'') or states(''input_text.heo_trip_full_generation'') == ''pending:''
        ~ states[''switch.home_energy_ev_charge_to_full''].context.id) }}'
      startup_feedback_pending: '{{ (not has_value(''sensor.home_energy_ev_control_status'')
        or state_attr(''sensor.home_energy_ev_control_status'', ''startup_feedback_pending'')
        is not sameas false) }}'
      resume_record: '{% set record = states(''input_text.heo_trip_resume_state'')
        | from_json({}) %}{{ record if record is mapping else {} }}'
      has_resume_record: '{{ states(''input_text.heo_trip_resume_state'') not in ['''',
        ''unknown'', ''unavailable''] }}'
      resume_unreadable: '{{ states(''input_text.heo_trip_resume_state'') in [''unknown'',
        ''unavailable''] }}'
      full_generation: '{{ state_attr(''sensor.home_energy_trip_charge_status'', ''full_generation'')
        }}'
      full_stop_reason: '{{ state_attr(''sensor.home_energy_trip_charge_status'',
        ''full_stop_reason'') }}'
      full_stop_generation: '{{ state_attr(''sensor.home_energy_trip_charge_status'',
        ''full_stop_generation'') }}'
      full_off_edge: '{{ trigger is defined and trigger.get(''id'') == ''full_changed''
        and trigger.get(''to_state'') is not none and trigger.to_state.state == ''off''
        and trigger.get(''from_state'') is not none and trigger.from_state.state ==
        ''on'' and (states(''input_text.heo_trip_full_generation'') == ''on:'' ~ trigger.from_state.last_changed.isoformat()
        ~ '':'' ~ trigger.from_state.context.id or states(''input_text.heo_trip_full_generation'')
        == ''pending:'' ~ trigger.from_state.context.id) }}'
      car_ready: '{{ is_state(''device_tracker.your_ev'', ''home'') and is_state(''binary_sensor.your_ev_cable'',
        ''on'') }}'
      control_ready: '{{ is_state(''switch.home_energy_automatic_ev_control'', ''on'')
        and is_state(''switch.home_energy_safety_lock'', ''off'') and state_attr(''sensor.home_energy_trip_charge_status'',
        ''full_generation'') is integer and states[''input_text.heo_trip_resume_state'']
        is not none and not (not has_value(''sensor.home_energy_ev_control_status'')
        or state_attr(''sensor.home_energy_ev_control_status'', ''startup_feedback_pending'')
        is not sameas false) and state_attr(''sensor.home_energy_ev_control_status'',
        ''gate'') == ''ready'' }}'
  - variables:
      soc_valid: '{{ 0 <= soc <= 100 }}'
      pause_requested: '{{ resume_record.get(''paused'') is sameas true }}'
      resume_valid: '{{ resume_record.get(''v'') is integer and resume_record.get(''v'')
        == 1 and resume_record.get(''first'') is number and resume_record.get(''first'')
        is not boolean and is_number(resume_record.get(''first'')) and resume_record.get(''expires'')
        is number and resume_record.get(''expires'') is not boolean and is_number(resume_record.get(''expires''))
        and 0 < resume_record.get(''first'') <= now_ts and resume_record.get(''first'')
        < resume_record.get(''expires'') and resume_record.get(''generation'') is
        integer and resume_record.get(''generation'') > 0 and resume_record.get(''paused'')
        is boolean }}'
      target_valid: '{{ 1 <= target <= 100 and states(''input_select.heo_trip_target_soc'')
        == (target | int | string) ~ ''%'' }}'
  - variables:
      plan_valid: "{{ plan.get('v') == 2 and plan.get('due') == due\n    and target_valid\
        \ and plan.get('target') == target\n    and plan.get('soc') == states('sensor.home_energy_ev_soc')\
        \ | float(-1)\n    and plan.get('cap') == states('sensor.home_energy_ev_usable_capacity')\
        \ | float(-1)\n    and plan.get('kw') == states('sensor.home_energy_ev_max_power')\
        \ | float(-1)\n    and plan.get('eff') == states('input_number.heo_trip_charge_efficiency')\
        \ | float(-1)\n    and plan.get('extra') == states('input_number.heo_trip_extra_minutes')\
        \ | float(-1)\n    and plan.get('maximum') == states('input_number.heo_trip_override_timeout')\
        \ | float(-1) }}\n"
  - variables:
      resuming: '{{ pause_requested and resume_valid }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ owned and resume_valid and now_ts >= resume_record.get(''expires'')
          }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.heo_trip_charge_started'',
            ''on'') and is_state(''switch.home_energy_ev_charge_to_full'', ''on'')
            and (states(''input_text.heo_trip_resume_state'') in ['''', ''unknown'',
            ''unavailable''] or ((states(''input_text.heo_trip_resume_state'') | from_json({}))
            is mapping and (states(''input_text.heo_trip_resume_state'') | from_json({})).get(''generation'')
            is integer and (states(''input_text.heo_trip_resume_state'') | from_json({})).get(''generation'')
            == state_attr(''sensor.home_energy_trip_charge_status'', ''full_generation'')))
            and states[''switch.home_energy_ev_charge_to_full''].context.user_id is
            none and (states(''input_text.heo_trip_full_generation'').startswith(''on:''
            ~ states[''switch.home_energy_ev_charge_to_full''].last_changed.isoformat()
            ~ '':'') or states(''input_text.heo_trip_full_generation'') == ''pending:''
            ~ states[''switch.home_energy_ev_charge_to_full''].context.id) }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.home_energy_ev_charge_to_full
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_scheduled
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: ''
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Expired
    - conditions:
      - condition: template
        value_template: '{{ owned and full_off_edge and soc_valid and target_valid
          and target == started_target and due == ticket and soc >= started_target
          }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_scheduled
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: ''
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Completed
    - conditions:
      - condition: template
        value_template: '{{ owned and (full_off_edge or not override_on) and resume_valid
          and armed and target_valid and target == started_target and due == ticket
          and (not soc_valid or soc < started_target) and now_ts < due and now_ts
          < resume_record.get(''expires'') and override_state == ''off'' and full_stop_reason
          == ''disconnected'' and full_stop_generation == resume_record.get(''generation'')
          and full_generation == resume_record.get(''generation'') + 1 }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: '{{ {''v'': 1, ''first'': resume_record.get(''first''), ''expires'':
            resume_record.get(''expires''), ''generation'': resume_record.get(''generation''),
            ''paused'': true} | to_json }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Paused — car disconnected
    - conditions:
      - condition: template
        value_template: '{{ owned and full_off_edge }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_scheduled
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: ''
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Interrupted
    - conditions:
      - condition: template
        value_template: '{{ owned and override_state not in [''on'', ''off''] }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Waiting for data
    - conditions:
      - condition: template
        value_template: '{{ owned and override_on and has_resume_record and full_generation
          is not integer }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Waiting for data
    - conditions:
      - condition: template
        value_template: '{{ owned and override_on and resume_valid and full_generation
          == resume_record.get(''generation'') + 1 and full_stop_generation == resume_record.get(''generation'')
          and full_stop_reason in [''disconnected'', ''completed'', ''timeout'', ''operator'',
          ''cancelled'', ''invalid_data''] }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Waiting for data
    - conditions:
      - condition: template
        value_template: '{{ owned and override_on and not owns_current_full }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_scheduled
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: ''
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Interrupted
    - conditions:
      - condition: template
        value_template: '{{ has_resume_record and not resume_valid }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.heo_trip_charge_started'',
            ''on'') and is_state(''switch.home_energy_ev_charge_to_full'', ''on'')
            and (states(''input_text.heo_trip_resume_state'') in ['''', ''unknown'',
            ''unavailable''] or ((states(''input_text.heo_trip_resume_state'') | from_json({}))
            is mapping and (states(''input_text.heo_trip_resume_state'') | from_json({})).get(''generation'')
            is integer and (states(''input_text.heo_trip_resume_state'') | from_json({})).get(''generation'')
            == state_attr(''sensor.home_energy_trip_charge_status'', ''full_generation'')))
            and states[''switch.home_energy_ev_charge_to_full''].context.user_id is
            none and (states(''input_text.heo_trip_full_generation'').startswith(''on:''
            ~ states[''switch.home_energy_ev_charge_to_full''].last_changed.isoformat()
            ~ '':'') or states(''input_text.heo_trip_full_generation'') == ''pending:''
            ~ states[''switch.home_energy_ev_charge_to_full''].context.id) }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.home_energy_ev_charge_to_full
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_scheduled
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heo_trip_charge_started
      - action: input_text.set_value
        target:
          entity_id: input_text.heo_trip_resume_state
        data:
          value: ''
      - action: input_select.select_option
        target:
          entity_id: input_select.heo_trip_charge_status
        data:
          option: Interrupted
    - conditions:
      - condition: template
        value_template: '{{ owned and (not armed or due != ticket or not target_valid
          or target != started_target) }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.heo_trip_charge_started'',
