    - 8%
    - 7%
    - 6%
    - 5%
    - 4%
    - 3%
    - 2%
    - 1%
  heo_trip_charge_status:
    name: HEO Trip Charge Status
    options:
    - Not scheduled
    - Waiting for start
    - Already at target
    - Waiting for car
    - Waiting for data
