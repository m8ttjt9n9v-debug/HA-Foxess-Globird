          | Backup | {{ 'Verified' if backup is sameas true else
                         'Not yet verified' if backup is sameas false else '—' }} |
          | Issue | {{ reasons.get(error, 'Needs a site check') if error else '—' }} |
          | Waiting for | {% if blockers is iterable and blockers is not string and blockers %}
            {%- for reason in blockers -%}{{ reasons.get(reason, 'An additional safety check') }}
            {{- '; ' if not loop.last else '' }}{%- endfor -%}{% else %}—{% endif %} |

          {% if phase == 'initial_update_required' %}
          Install a maintenance-capable HEO release through HACS at this site first.
          {% elif phase in ['unknown', 'unavailable', 'none'] %}
          Check the site before retrying. No update or restart is automatically replayed.
          {% endif %}
          Downloaded does not mean running. A restart is verified separately.
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.home_energy_fleet_charlie_maintenance
          state_not: unknown
        - condition: state
          entity: sensor.home_energy_fleet_charlie_maintenance
          state_not: unavailable
        - condition: state
          entity: sensor.home_energy_fleet_charlie_maintenance
          state_not: initial_update_required
        card:
          type: vertical-stack
          cards:
          - type: entities
            show_header_toggle: false
            entities:
            - entity: select.home_energy_fleet_charlie_release
              name: Release
          - type: horizontal-stack
            cards:
            - type: button
              name: Update & restart
              icon: mdi:update
              show_state: false
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.home_energy_fleet_charlie_update_and_restart
                confirmation:
                  text: Back up Remote site 2, then install the selected HEO release and restart when
                    safely idle. Wait up to 60 minutes; active charging or export will not be stopped.
                    New HEO actions pause during maintenance; avoid approaching charge deadlines. Only
                    this site is affected.
              hold_action:
                action: none
            - type: button
              name: Restart
              icon: mdi:restart
              show_state: false
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.home_energy_fleet_charlie_restart
                confirmation:
                  text: Back up Remote site 2, then restart Home Assistant when safely idle. Wait up to
                    60 minutes; active charging or export will not be stopped. New HEO actions pause during
                    maintenance; avoid approaching charge deadlines. Only this site is affected.
              hold_action:
                action: none
