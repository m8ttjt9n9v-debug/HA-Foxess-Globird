test_force_charge:
  name: Start force-charge test
  description: Start a bounded force-charge commissioning test. The integration refuses this outside the free-charge window.
  fields:
    power_kw:
      name: Charge power
      description: Requested battery charge power in kW.
      example: 2
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
    duration_minutes:
      name: Duration
      description: Test duration in minutes; maximum 30.
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
test_force_discharge:
  name: Start force-discharge test
  description: Start a bounded force-discharge commissioning test using the entered export-rate preview.
  fields:
    power_kw:
      name: Discharge power
      description: Requested battery discharge power in kW.
      example: 2
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
    duration_minutes:
      name: Duration
      description: Test duration in minutes; maximum 30.
      example: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
test_stop:
  name: Stop test and restore Self Use
  description: Stop an active commissioning test, clear both force-power targets, and select Self Use.
  fields:
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
