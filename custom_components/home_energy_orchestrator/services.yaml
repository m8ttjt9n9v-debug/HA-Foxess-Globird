maintenance_status:
  name: Read maintenance status
  description: Read host-wide maintenance capability, running/downloaded versions and audit. Does not install, restart or control devices.
maintenance_update_and_restart:
  name: Update HEO and restart when safe
  description: Administrator-only node endpoint used by Fleet. Wait for trusted idle feedback, verify backup, install the chosen published release, check configuration and request one restart.
  fields:
    request_id:
      name: Unique request ID
      required: true
      selector:
        text:
    issued_at:
      name: Request time
      description: Aware ISO-8601 timestamp for this fresh request.
      required: true
      selector:
        text:
    version:
      name: Published HEO release
      required: true
      selector:
        text:
    wait_minutes:
      name: Maximum wait for a safe time
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
maintenance_restart:
  name: Restart Home Assistant when safe
  description: Administrator-only node endpoint used by Fleet. Back up and request one restart only when all HEO entries and physical feedback are safely idle.
  fields:
    request_id:
      name: Unique request ID
      required: true
      selector:
        text:
    issued_at:
      name: Request time
      required: true
      selector:
        text:
    wait_minutes:
      name: Maximum wait for a safe time
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
fleet_maintenance_update:
  name: Update one Fleet site
  description: Administrator-only. Submit the selected site's chosen published HEO release once; the node performs backup and safe-time update/restart checks.
  fields:
    site:
      name: Configured site key
      required: true
      selector:
        text:
fleet_maintenance_restart:
  name: Restart one Fleet site
  description: Administrator-only. Submit one backed-up safe-time restart to a configured site. No download or device commands.
  fields:
    site:
      name: Configured site key
      required: true
      selector:
        text:
fleet_maintenance_refresh:
  name: Refresh Fleet maintenance status
  description: Administrator-only read-only refresh. Never repeats or resumes an installation/restart request.
manual_export_max:
  name: Export at maximum inverter power
  description: Hold manual battery control and request the lesser of the commissioned and native discharge maxima until explicitly stopped. Disable competing VPP control first. This is inverter output, not guaranteed grid export.
  fields:
    local_control_confirmed:
      name: Competing cloud/VPP control disabled
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      selector:
        text:
    request_id:
      name: Fleet request identifier
      selector:
        text:
    issued_at:
      name: Request time (ISO8601 with timezone)
      selector:
        text:
manual_self_use:
  name: Stop forced export and hold Self Use
  description: Select Self Use, clear both forced targets and keep automatic battery control paused. EV control is unchanged. Safety Lock and ownership still apply.
  fields:
    local_control_confirmed:
      name: Competing cloud/VPP control disabled
      selector:
        boolean:
    entry_id:
      name: Config entry
      selector:
        text:
    request_id:
      name: Fleet request identifier
      selector:
        text:
    issued_at:
      name: Request time (ISO8601 with timezone)
      selector:
        text:
manual_resume_automatic:
  name: Resume automatic battery control
  description: Confirm Self Use with zero forced targets before releasing the manual hold. Restore eligibility of the user's unchanged charge/export requests; no automatic switch is enabled by this action.
  fields:
    local_control_confirmed:
      name: Competing cloud/VPP control disabled
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      selector:
        text:
    request_id:
      name: Fleet request identifier
      selector:
        text:
    issued_at:
      name: Request time (ISO8601 with timezone)
      selector:
        text:
test_force_charge:
  name: Start force-charge test
  description: Start a bounded force-charge commissioning test. The integration refuses this outside the free-charge window.
  fields:
    power_kw:
      name: Charge power
      description: Requested battery charge power in kW.
      example: 2
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
    duration_minutes:
      name: Duration
      description: Test duration in minutes; maximum 120.
      example: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
test_force_discharge:
  name: Start force-discharge test
  description: Start a bounded force-discharge commissioning test using the configured export rate for the current time.
  fields:
    power_kw:
      name: Discharge power
      description: Requested battery discharge power in kW.
      example: 2
      selector:
        number:
          min: 0.1
          max: 15
          step: 0.1
    duration_minutes:
      name: Duration
      description: Test duration in minutes; maximum 120.
      example: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
test_stop:
  name: Stop test and restore Self Use
  description: Stop an active commissioning test, clear both force-power targets, and select Self Use.
  fields:
    entry_id:
      name: Config entry
      description: Required only when more than one Home Energy Orchestrator site is configured.
      selector:
        text:
