name: Tests

on:
  push:
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ".[test]" ruff
      - run: ruff check custom_components tests
      - run: pytest
