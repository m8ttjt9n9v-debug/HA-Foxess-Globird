name: Repair GitHub Release notes

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma- or space-separated release tags to repair"
        required: true
        default: "v0.12.21, v0.12.22, v0.12.23, v0.12.24, v0.12.25, v0.12.26, v0.12.27, v0.12.28, v0.12.29rc1, v0.12.29rc7, v0.12.29rc8"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Repair descriptive release titles and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          normalized_tags="$(printf '%s' "$RELEASE_TAGS" | tr ',[:space:]' '\n' | sed '/^$/d')"
          test -n "$normalized_tags"
          while IFS= read -r tag; do
            python -m scripts.release_notes \
              --tag "$tag" \
              --title-file .github-release-title.txt \
              --notes-file .github-release-notes.md
            gh release view "$tag" >/dev/null
            gh release edit "$tag" \
              --title "$(<.github-release-title.txt)" \
              --notes-file .github-release-notes.md
          done <<< "$normalized_tags"
