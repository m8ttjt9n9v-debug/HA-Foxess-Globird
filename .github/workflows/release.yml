name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install ".[test]" ruff
      - run: ruff check custom_components tests scripts
      - run: pytest
      - run: python -m scripts.previous_release_rehearsal --tag v0.12.26

      - name: Verify tagged version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(
            python -c 'import json; print(json.load(open("custom_components/home_energy_orchestrator/manifest.json"))["version"])'
          )"
          test "$tag_version" = "$manifest_version"

      - name: Build integration archive
        shell: bash
        working-directory: custom_components/home_energy_orchestrator
        run: |
          zip -r "$GITHUB_WORKSPACE/home_energy_orchestrator.zip" . \
            -x '__pycache__/*' '*.pyc' '.DS_Store'

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(unzip -Z1 home_energy_orchestrator.zip | head -n 1)" != "custom_components/"
          unzip -Z1 home_energy_orchestrator.zip | grep -Fxq 'manifest.json'
          unzip -Z1 home_energy_orchestrator.zip | grep -Fxq '__init__.py'

      - name: Create or repair GitHub release with counted asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" home_energy_orchestrator.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" home_energy_orchestrator.zip \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
